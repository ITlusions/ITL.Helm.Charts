apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: headplane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headplane
      annotations:
        # Zonder deze checksum start een ConfigMap-only wijziging geen rollout.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: headplane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/headplane/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: cookie-secret
              mountPath: /etc/headplane/cookie
              readOnly: true
            - name: headscale-api-key
              mountPath: /etc/headplane/headscale-api
              readOnly: true
            - name: oidc-secret
              mountPath: /etc/headplane/oidc
              readOnly: true
            - name: data
              mountPath: {{ .Values.server.dataPath }}
          resources:
            {{- toYaml (.Values.resources | default dict) | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: headplane-config
        - name: cookie-secret
          secret:
            secretName: {{ .Values.server.cookieSecretRef.name }}
            items:
              - key: {{ .Values.server.cookieSecretRef.key }}
                path: cookie-secret
        - name: headscale-api-key
          secret:
            secretName: {{ .Values.headscale.apiKeySecretRef.name }}
            items:
              - key: {{ .Values.headscale.apiKeySecretRef.key }}
                path: api-key
        - name: oidc-secret
          secret:
            secretName: {{ .Values.keycloak.clientSecretRef.name }}
            items:
              - key: {{ .Values.keycloak.clientSecretRef.key | default "client-secret" }}
                path: client-secret
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
