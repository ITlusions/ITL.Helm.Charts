{{- range .Values.intermediates }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "itlusions-%s-ca" .name }}
spec:
  isCA: true
  commonName: {{ .commonName | quote }}
  subject:
    organizations: {{ .organization | toYaml | nindent 6 }}
    countries: {{ .country | toYaml | nindent 6 }}
  duration: {{ .duration | quote }}
  secretName: {{ .secretName | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: itlusions-root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .issuerName | quote }}
spec:
  ca:
    secretName: {{ .secretName | quote }}
---
{{- end }}
