apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: itlusions-root-ca-bootstrap-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: itlusions-root-ca
spec:
  isCA: true
  commonName: {{ .Values.root.commonName | quote }}
  subject:
    organizations: {{ .Values.root.organization | toYaml | nindent 6 }}
    countries: {{ .Values.root.country | toYaml | nindent 6 }}
  duration: {{ .Values.root.duration | quote }}
  secretName: {{ .Values.root.secretName | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: itlusions-root-ca-bootstrap-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: itlusions-root-ca-issuer
spec:
  ca:
    secretName: {{ .Values.root.secretName | quote }}
