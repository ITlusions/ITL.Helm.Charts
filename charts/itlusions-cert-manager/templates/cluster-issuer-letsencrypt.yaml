{{- if .Values.letsEncryptIssuer.enabled }}
# Same hook requirement as cluster-issuer-selfsigned.yaml -- see that file's comment.
#
# digitalOcean solver, not http01: confirmed against the real ClusterIssuer CRD
# (`kubectl explain clusterissuer.spec.acme.solvers.dns01`) that `digitalocean` is a supported
# dns01 provider, matching ITlusions's own DNS/infra provider. The token Secret must live in
# cert-manager's own release namespace (cert-manager resolves ClusterIssuer secretRefs against
# --cluster-resource-namespace, which defaults to wherever this chart itself is installed) --
# not generated by this chart, see values.yaml's letsEncryptIssuer comment.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.letsEncryptIssuer.name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
spec:
  acme:
    server: {{ .Values.letsEncryptIssuer.server | quote }}
    email: {{ required "letsEncryptIssuer.email is required when letsEncryptIssuer.enabled is true" .Values.letsEncryptIssuer.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.letsEncryptIssuer.name }}-account-key
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: {{ .Values.letsEncryptIssuer.digitalOcean.tokenSecretName }}
              key: {{ .Values.letsEncryptIssuer.digitalOcean.tokenSecretKey }}
{{- end }}
