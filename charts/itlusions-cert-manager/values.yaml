cert-manager:
  crds:
    enabled: true
    keep: true
  webhook:
    # Reduce webhook timeout to avoid issues with cluster maintenance
    timeoutSeconds: 20

# Enabled by default: works on any cluster with zero external dependencies, for internal/dev
# TLS (e.g. the bitwarden-sdk-server cert in itlusions-external-secrets used its own dedicated
# Issuer instead of this, specifically to stay self-contained -- this ClusterIssuer is for
# everything else that just needs *a* trusted-within-cluster cert).
selfSignedIssuer:
  enabled: true
  name: itlusions-selfsigned

# Off by default: needs a real ACME account email and a real DigitalOcean API token (not
# generated by this chart -- same category as itlusions-external-secrets' Bitwarden token: a
# real external credential). Defaults to the staging ACME server so a misconfiguration doesn't
# burn through Let's Encrypt's production rate limits; switch server to the production URL
# once you've confirmed a staging cert issues correctly.
letsEncryptIssuer:
  enabled: false
  name: itlusions-letsencrypt
  email: ""
  server: https://acme-staging-v02.api.letsencrypt.org/directory
  digitalOcean:
    # Not generated by this chart -- create it yourself:
    #   kubectl create secret generic digitalocean-dns-token -n cert-manager \
    #     --from-literal=token=<your DO API token>
    tokenSecretName: digitalocean-dns-token
    tokenSecretKey: token
