{{/*
Genereert de secrets die deze chart zelf kan aanmaken. Hergebruikt een bestaande waarde via lookup,
zodat een upgrade de secret niet vervangt. lookup werkt alleen met helm install/upgrade, niet met
helm template of een Argo CD-render.
*/}}
{{- define "itlusions-headscale.existingOrRandom" -}}
{{- $existing := lookup "v1" "Secret" .namespace .name -}}
{{- if and $existing (hasKey $existing.data .key) -}}
{{- index $existing.data .key | b64dec -}}
{{- else -}}
{{- randAlphaNum (int .length) -}}
{{- end -}}
{{- end -}}
{{- if .Values.secrets.manage }}
{{- $clientSecret := include "itlusions-headscale.existingOrRandom" (dict "namespace" .Values.keycloak.namespace "name" .Values.oidc.clientSecretRef.name "key" "client-secret" "length" 32) }}
{{- if .Values.keycloak.enabled }}
---
# Gelezen door de Keycloak Operator voor de KeycloakOIDCClient (auth.secretRef).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.clientSecretRef.name }}
  namespace: {{ .Values.keycloak.namespace }}
  labels:
    operator.keycloak.org/kind: KeycloakOIDCClient
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
{{- end }}
---
# Zelfde waarde als in de Keycloak-namespace; Headscale leest deze voor de OIDC-login.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.clientSecretRef.name }}
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
{{- end }}
